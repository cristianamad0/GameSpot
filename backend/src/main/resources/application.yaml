spring:
  application:
    name: backend
  datasource:
    # Base de datos en Supabase. La contraseña se toma de la variable de entorno
    # SUPABASE_DB_CONTRASENA: nunca escribirla aquí (la Definition of Done
    # bloquea credenciales en el código).
    url: "${SUPABASE_DB_URL:jdbc:postgresql://db.wczlrqrertriwlmrlasz.supabase.co:5432/postgres?sslmode=require}"
    username: "${SUPABASE_DB_USUARIO:postgres}"
    password: "${SUPABASE_DB_CONTRASENA:}"
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo define src/main/resources/db/esquema.sql. Hibernate solo
      # verifica que las entidades coincidan con las tablas; no crea ni borra nada.
      ddl-auto: validate
  mail:
    # CACS-8: Gmail por SMTP con una contraseña de aplicación. El usuario y la
    # contraseña se toman de variables de entorno: nunca escribirlos aquí.
    host: smtp.gmail.com
    port: 587
    username: "${CORREO_USUARIO:}"
    password: "${CORREO_CONTRASENA_APLICACION:}"
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

app:
  cli:
    registration:
      enabled: true
  jwt:
    # Secreto para firmar los tokens: se toma de la variable de entorno JWT_SECRETO
    # (al menos 32 caracteres). Sin valor por defecto, para que la aplicación no
    # arranque con un secreto conocido.
    secret: "${JWT_SECRETO}"
    expiration-ms: 3600000
  pagos:
    # CACS-21: proveedor del adelanto, "simulado" (por defecto) o "wompi". Con "wompi" el
    # pago simulado queda desactivado y la aplicación no arranca sin las llaves de Wompi.
    proveedor: "${APP_PAGOS_PROVEEDOR:simulado}"
    wompi:
      # Llaves del comercio: solo por variables de entorno, nunca escritas aquí.
      llave-publica: "${WOMPI_LLAVE_PUBLICA:}"
      secreto-eventos: "${WOMPI_SECRETO_EVENTOS:}"
      secreto-integridad: "${WOMPI_SECRETO_INTEGRIDAD:}"
      url-api: "${WOMPI_URL_API:https://sandbox.wompi.co/v1}"
      url-checkout: "https://checkout.wompi.co/p/"
      url-retorno: "${WOMPI_URL_RETORNO:http://localhost:4200/reservas/{reservaId}/pagar}"
  reservas:
    expiracion:
      # CACS-12: cada cuánto se pasan a EXPIRADA las reservas no pagadas a tiempo.
      habilitada: true
      intervalo-ms: 60000
  notificaciones:
    envio:
      # CACS-8: la tarea que envía los correos solo corre si se activa, porque
      # necesita CORREO_USUARIO y CORREO_CONTRASENA_APLICACION. Las notificaciones se
      # crean igual al confirmarse cada reserva y se envían cuando se active.
      habilitada: "${APP_NOTIFICACIONES_HABILITADAS:false}"
      intervalo-ms: 60000
