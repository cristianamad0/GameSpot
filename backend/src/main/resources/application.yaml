spring:
  application:
    name: backend
  datasource:
    url: jdbc:h2:mem:gamespot;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  cli:
    registration:
      enabled: true
  jwt:
    secret: cambio-este-valormuy-secreto-GameSpot-2026
    expiration-ms: 3600000
