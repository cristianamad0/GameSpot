spring:
  application:
    name: backend
  datasource:
    # Base de datos en Supabase. La contraseña se toma de la variable de entorno
    # SUPABASE_DB_CONTRASENA: nunca escribirla aquí (la Definition of Done
    # bloquea credenciales en el código).
    url: "${SUPABASE_DB_URL:jdbc:postgresql://db.wczlrqrertriwlmrlasz.supabase.co:5432/postgres?sslmode=require}"
    username: "${SUPABASE_DB_USUARIO:postgres}"
    password: "${SUPABASE_DB_CONTRASENA:}"
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo define src/main/resources/db/esquema.sql. Hibernate solo
      # verifica que las entidades coincidan con las tablas; no crea ni borra nada.
      ddl-auto: validate

app:
  cli:
    registration:
      enabled: true
  jwt:
    # Secreto para firmar los tokens: se toma de la variable de entorno JWT_SECRETO
    # (al menos 32 caracteres). Sin valor por defecto, para que la aplicación no
    # arranque con un secreto conocido.
    secret: "${JWT_SECRETO}"
    expiration-ms: 3600000
  reservas:
    expiracion:
      # CACS-12: cada cuánto se pasan a EXPIRADA las reservas no pagadas a tiempo.
      habilitada: true
      intervalo-ms: 60000
