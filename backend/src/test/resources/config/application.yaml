# Configuración que se suma a src/main/resources/application.yaml solo en las pruebas.
app:
  jwt:
    # Valor exclusivo para pruebas: no es un secreto y nunca se usa fuera de ellas.
    secret: "secreto-solo-para-pruebas-automatizadas-gamespot"
  reservas:
    expiracion:
      # Las pruebas llaman a ExpiracionReservasService directamente; la tarea
      # programada no debe correr en segundo plano mientras tanto.
      habilitada: false
  notificaciones:
    envio:
      # CACS-8: las pruebas llaman a NotificacionService directamente y con el
      # correo simulado; la tarea nunca corre aquí.
      habilitada: false
